name: biobarrier-gate

# Гейт витрины: арифметика БиоБарьера обязана держать известные ответы.
# Наследие Task 174 («гейты не вызывались ни одним CI») — здесь гейт
# в CI с первого дня, а не на памяти владельца.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  known-answers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Известные ответы + золото тоталов + структура банка + payload бенчмарка v0.4
        run: node --test tests/bioscore.test.mjs tests/telemetry.test.mjs
